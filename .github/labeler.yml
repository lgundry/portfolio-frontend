# This workflow will triage pull requests and apply a label based on the
# paths that are modified in the pull request.
#
# For more information, see: https://github.com/actions/labeler

frontend:
  - changed-files:
      - any-glob-to-any-file: ['src/**', 'public/**', '*.html']

styles:
  - changed-files:
      - any-glob-to-any-file: ['**/*.css', '**/*.scss', 'tailwind.config.*']

dependencies:
  - changed-files:
      - any-glob-to-any-file: ['package.json', 'package-lock.json', 'yarn.lock', 'pnpm-lock.yaml']

documentation:
  - changed-files:
      - any-glob-to-any-file: ['README.md', 'docs/**', '**/*.md']

config:
  - changed-files:
      - any-glob-to-any-file: ['.github/**', '*.config.js', '*.config.ts', 'vite.config.*', 'webpack.config.*', '.eslintrc*', '.prettierrc*']
